        "matrix": { "type": "array", "items": { "type": "array", "items": { "type": "number" } } }, "labels": { "type": "array", "items": { "type": "string" } },
        "models": { "type": "array", "items": { "type": "object", "required": ["version", "status", "accuracy", "date"], "properties": { "version": { "type": "string" }, "status": { "type": "string" }, "accuracy": { "type": "number" }, "date": { "type": "string" } } } },
        "corrections": { "type": "array", "items": { "$ref": "#/components/schemas/Correction" } }
